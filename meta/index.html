<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meta Analysis</title>

  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
</head>

<body>

  <h1>Meta Analysis</h1>

  <p>This page shows statistics about our codebase.</p>

  <!-- SLIDER -->
  <div>
    <label for="commit-progress">
      Show commits until:

      <input
        id="commit-progress"
        type="range"
        min="0"
        max="100"
        value="100"
      >

      <time id="commit-time-display"></time>
    </label>
  </div>

  <!-- FILE VISUALIZATION -->
  <dl id="files"></dl>

  <!-- STATS -->
  <div id="stats"></div>

  <!-- SCROLLYTELLING -->
  <div id="scrolly-1">

    <!-- LEFT SIDE -->
    <div id="scatter-story"></div>

    <!-- RIGHT SIDE -->
    <div id="scatter-plot">

      <h2>Commits by time of day</h2>

      <div id="chart"></div>

      <p id="selection-count">
        No commits selected
      </p>

      <dl id="language-breakdown" class="stats"></dl>

    </div>

  </div>

  <!-- TOOLTIP -->
  <dl id="commit-tooltip" class="info tooltip" hidden>

    <dt>Commit</dt>
    <dd>
      <a href="" id="commit-link" target="_blank"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Lines Edited</dt>
    <dd id="commit-lines"></dd>

  </dl>

  <!-- MAIN JS -->
  <script type="module" src="main.js"></script>

</body>
</html>
